<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartlabFront</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css"
/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<script>
  (function () {
    var mq = matchMedia('(prefers-color-scheme: dark)');

    function apply() {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && mq.matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    }

    apply();
    mq.addEventListener('change', apply);
  })();
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
