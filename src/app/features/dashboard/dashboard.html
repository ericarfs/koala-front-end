<app-content-layout
  title="Dashboard"
>
  <div class="flex flex-col gap-6">
    <form [formGroup]="filterForm" class="flex flex-col gap-4 bg-container border border-outline rounded-md p-4 break-all">
      <div class="flex flex-wrap gap-4">
        <div class="flex flex-col gap-1 w-full lg:w-auto md:min-w-75">
          <label for="location" class="text-sm text-neutral font-medium mb-1.5">
            {{'MONITORING.FILTERS.LOCATION' | translate}}
          </label>
          <app-location-tree-select formControlName="location"></app-location-tree-select>
        </div>

        <div class="flex flex-col gap-1 w-full lg:max-w-140">
          <label for="timeBucket" class="text-sm text-neutral font-medium mb-1.5">
            {{'MONITORING.FILTERS.INTERVAL' | translate}}
          </label>
          <div class="flex flex-wrap border border-outline rounded-md min-h-10 overflow-hidden">
            @for (opt of intervalOptions; track opt.id) {
              <button
                type="button"
                class="flex-1 basis-1/4 md:basis-1/7 cursor-pointer px-4 py-2 text-sm transition-colors"
                [class.bg-primary]="filterForm.value.timeBucket === opt.id"
                [class.text-primary-foreground]="filterForm.value.timeBucket === opt.id"
                (click)="filterForm.controls.timeBucket.setValue(opt.id)"
              >
                {{ opt.text }}
              </button>
            }
          </div>
        </div>

        <div class="flex flex-wrap gap-2 max-w-full">
          <div class="flex flex-col gap-1 max-w-full">
            <label for="fromDate" class="text-sm text-neutral font-medium mb-1">
              {{ 'MONITORING.DATE_RANGE.FROM' | translate }}
            </label>
            <input type="date" class="border border-outline rounded-md px-3 py-2 bg-container text-default" formControlName="fromDate">
          </div>

          <div class="flex flex-col gap-1 max-w-full">
            <label for="toDate" class="text-sm text-neutral font-medium mb-1">
              {{ 'MONITORING.DATE_RANGE.TO' | translate }}
            </label>
            <input type="date" class="border border-outline rounded-md px-3 py-2 bg-container text-default" formControlName="toDate">
          </div>
        </div>
      </div>

      <app-chip-select
        label="MONITORING.FILTERS.DEVICE_TYPES"
        [options]="deviceTypeOptions"
        [max]="2"
        [selected]="selectedTypes()"
        (selectedChange)="onTypesChange($event)"
      />

      @if (selectedTypes().length === 1 && availableDevices().length > 0) {
        <app-chip-select
          label="MONITORING.FILTERS.DEVICES"
          [options]="availableDevices()"
          [max]="5"
          [(selected)]="selectedDevices"
        />
      }

      <button
        type="button"
        class="btn w-full md:w-fit px-4 py-2 gap-2 bg-primary text-primary-foreground"
        [disabled]="filterForm.invalid || selectedTypes().length === 0"
        (click)="search()"
      >
        @if (store.loading()) {
          <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span>{{ 'COMMON.STATES.SEARCHING' | translate }}</span>
        } @else {
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>{{ 'COMMON.ACTIONS.SEARCH' | translate }}</span>
        }
      </button>
    </form>

    <app-chart-panel
      [data]="store.data()"
      [loading]="store.loading()"
      [error]="store.error()"
      [title]="chartTitle()"
      [subtitle]="chartSubtitle()"
    />

  </div>
</app-content-layout>
