<app-content-layout
  [title]="'LOCATIONS.LIST.TITLE' | translate"
  [subtitle]="'LOCATIONS.LIST.SUBTITLE' | translate"
>
  <button
        actions
        type="button"
        (click)="newLocation()"
        class="btn px-4 bg-primary text-primary-foreground hover:bg-primary-details gap-1"
      >
        <i class="fa-solid fa-plus"></i>
        {{'LOCATIONS.ADD.TITLE' | translate}}
  </button>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-1">
    @for(location of pagination.pagedItems(); track location.id){
      <app-location-card
        [location]="location"
        [actionLabel]="actionLabel(location)"
        (edit)="updateLocation($event)"
        (delete)="deleteLocation($event)"
      ></app-location-card>
    }
  </div>
  <app-paginator
    [(pageIndex)]="pagination.pageIndex"
    [totalPages]="pagination.totalPages()"
  />
</app-content-layout>
