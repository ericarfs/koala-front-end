<app-content-layout
  [title]="'LOCATIONS.LIST.TITLE' | translate"
  [subtitle]="'LOCATIONS.LIST.SUBTITLE' | translate"
>
  <button
        actions
        type="button"
        (click)="newLocation()"
        class="btn px-4 bg-primary text-primary-foreground hover:bg-primary-details gap-1"
      >
        <i class="fa-solid fa-plus"></i>
        {{'LOCATIONS.ADD.TITLE' | translate}}
  </button>
  @if (locations().length === 0) {
    <p class="text-neutral text-xl">
      {{'LOCATIONS.LIST.EMPTY' | translate}}
    </p>
  } @else {
    <form class="flex flex-wrap items-end break-all" [formGroup]="searchForms">
      <div class="flex flex-col gap-1 w-full md:w-auto md:min-w-100">
        <app-location-tree-select formControlName="currentLocation"></app-location-tree-select>
      </div>
    </form>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-1">
      @for(location of pagination.pagedItems(); track location.id){
        <app-location-card
          [location]="location"
          [actionLabel]="actionLabel(location)"
          [stats]="statsFor(location)"
          (edit)="updateLocation($event)"
          (delete)="deleteLocation($event)"
        ></app-location-card>
      }
    </div>
    <app-paginator
      [(pageIndex)]="pagination.pageIndex"
      [totalPages]="pagination.totalPages()"
    />
  }
</app-content-layout>
