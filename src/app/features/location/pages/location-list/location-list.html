<app-content-layout
  [title]="'LOCATIONS.LIST.TITLE' | transloco"
  [subtitle]="'LOCATIONS.LIST.SUBTITLE' | transloco"
>
  <button
        actions
        type="button"
        (click)="newLocation()"
        class="btn px-4 bg-primary text-primary-foreground hover:bg-primary-details gap-1"
      >
        <i class="fa-solid fa-plus"></i>
        {{'LOCATIONS.ADD.TITLE' | transloco}}
  </button>
  @if (store.loading()) {
    <div class="flex flex-col gap-1 w-full md:w-auto md:max-w-160">
      <div class="flex items-center h-10 px-3 w-full bg-container border border-outline rounded-md animate-pulse">
        <div class="bg-neutral/10 h-4 w-30 rounded animate-pulse"></div>
      </div>
    </div>

    <div class="flex w-full md:max-w-160 gap-1">
      <app-location-card-skeleton/>
    </div>
  }
  @else if (locations().length === 0) {
    <p class="text-neutral text-xl">
      {{'LOCATIONS.LIST.EMPTY' | transloco}}
    </p>
  } @else {
    <form class="flex flex-wrap items-end break-all" [formGroup]="searchForms">
      <div class="flex flex-col gap-1 w-full md:w-auto md:min-w-160">
        <app-location-tree-select formControlName="currentLocation"></app-location-tree-select>
      </div>
    </form>
    <div class="flex w-full md:max-w-160 gap-1">
      @for(location of pagination.pagedItems(); track location.id){
        <app-location-card
          [location]="location"
          [actionLabel]="actionLabel(location)"
          [stats]="statsStore.statsFor(location.id)"
          [statsLoading]="statsStore.loading()"
        ></app-location-card>
      }
    </div>
    <app-paginator
      [(pageIndex)]="pagination.pageIndex"
      [totalPages]="pagination.totalPages()"
    />
  }
</app-content-layout>
