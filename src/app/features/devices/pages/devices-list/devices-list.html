<app-content-layout
  [title]="'DEVICES.LIST.TITLE' | translate"
  [subtitle]="'DEVICES.LIST.SUBTITLE' | translate"
>
  <div class="flex flex-col gap-6 flex-1">

    <form class="flex flex-wrap items-end gap-4 bg-container border border-outline rounded-md p-4 break-all" [formGroup]="searchForms">

      <div class="flex flex-col gap-1 w-full md:w-auto md:flex-1 md:min-w-[200px]">
        <app-input
          class="w-full md:w-auto md:flex-1 md:min-w-[200px]"
          label="MONITORING.FILTERS.DEVICE_NAME"
          placeholder="MONITORING.FILTERS.DEVICE_NAME_PLACEHOLDER"
          formControlName="name"
        ></app-input>
      </div>

      <div class="flex flex-col gap-1 w-full md:w-auto md:min-w-50">
        <label class="text-sm text-neutral font-medium mb-1.5">
          {{"MONITORING.FILTERS.LOCATION" | translate}}
        </label>
          <app-location-tree-select formControlName="deviceLocation"></app-location-tree-select>
      </div>

      <div class="flex flex-col gap-1 w-full md:w-auto">
        <span class="text-sm text-neutral font-medium mb-1.5">Status</span>
        <div class="flex flex-wrap border border-outline rounded-md overflow-hidden min-h-10">
          @for (status of statusOptions; track status.value; let first = $first) {
            <button
              type="button"
              class="flex-1 md:flex-none cursor-pointer px-4 py-2 text-xs md:text-sm transition-colors"
              [class.bg-primary]="searchForms.value.deviceStatus === status.value"
              [class.font-medium]="searchForms.value.deviceStatus === status.value"
              [class.text-primary-foreground]="searchForms.value.deviceStatus === status.value"
              (click)="setStatus(status.value)"
            >
             {{ status.labelKey | translate }}
            </button>
          }
        </div>
      </div>

    </form>

    <div class="flex flex-col gap-3 break-all flex-1">
      <h2 class="text-lg font-semibold">
        Dispositivos ({{ devices().length }})
      </h2>

      <app-device-list
        [devices]="devices()"
        [resolveLocationName]="getLocationName"
      ></app-device-list>
    </div>

  </div>
</app-content-layout>
