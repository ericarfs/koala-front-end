<app-content-layout
  [title]="'DEVICES.LIST.TITLE' | transloco"
  [subtitle]="device()?.name">
  @if (device(); as dev) {
    <div class="flex flex-col gap-6">

      <button (click)="goBack()" class="text-primary hover:text-primary-details inline-flex items-center gap-1 w-fit cursor-pointer">
        <i class="fa-solid fa-arrow-left"></i> Voltar
      </button>

      <div class="bg-container border border-outline rounded-md p-4 flex flex-col gap-2 break-all">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <h1 class="text-2xl font-bold">{{ dev.name }}</h1>

          <div
            [class]="dev.available
              ? 'bg-success text-success-foreground'
              : 'bg-destructive text-destructive-foreground'"
            class="inline-flex w-30 max-w-full justify-center items-center gap-1.5 py-1 text-sm font-medium rounded-full"
          >
            {{ dev.available ? 'Online' : 'Offline' }}
          </div>
        </div>
        @if (dev.description) {
          <p class="text-sm text-neutral">{{ dev.description }}</p>
        }
        <div class="flex flex-wrap gap-1 mt-1">
          @for (type of dev.types; track type.id) {
            <span class="inline-flex items-center px-3 py-1 rounded-sm text-xs bg-neutral/10 text-neutral">
              {{ type.name }}
            </span>
          }
        </div>
      </div>

      <form [formGroup]="filterForm" class="flex flex-col gap-4 bg-container border border-outline rounded-md p-4 break-all">
        <div class="flex flex-wrap gap-4">
          <div class="flex flex-col gap-1 w-full lg:max-w-140">
            <label for="timeBucket" class="text-sm text-neutral font-medium mb-1.5">
              {{'MONITORING.FILTERS.INTERVAL' | transloco}}
            </label>
            <app-interval-selector
              [options]="intervalOptions"
              [value]="filterForm.value.timeBucket"
              (valueChange)="filterForm.controls.timeBucket.setValue($event)"
            />
          </div>

          <div class="flex flex-wrap gap-2 max-w-full">
            <div class="flex flex-col gap-1 max-w-full">
              <label for="fromDate" class="text-sm text-neutral font-medium mb-1">
                {{ 'MONITORING.DATE_RANGE.FROM' | transloco }}
              </label>
              <input type="date" class="border border-outline rounded-md px-3 py-2 bg-container text-default" formControlName="fromDate">
            </div>

            <div class="flex flex-col gap-1 max-w-full">
              <label for="toDate" class="text-sm text-neutral font-medium mb-1">
                {{ 'MONITORING.DATE_RANGE.TO' | transloco }}
              </label>
              <input type="date" class="border border-outline rounded-md px-3 py-2 bg-container text-default" formControlName="toDate">
            </div>
          </div>
        </div>

        <app-chip-select
          label="MONITORING.FILTERS.DEVICE_TYPES"
          [options]="dev.types"
          [max]="2"
          [(selected)]="selectedTypes"
        />

        <app-search-button
          [loading]="store.loading()"
          [disabled]="filterForm.invalid || selectedTypes().length === 0"
          (clicked)="search()"
        />
      </form>

      <app-chart-panel
        emptyKey="MONITORING.EMPTY.DEVICES"
        [data]="store.data()"
        [loading]="store.loading()"
        [error]="store.error()"
        [title]="chartTitle()"
        [subtitle]="chartSubtitle()"
      />
    </div>
  } @else {
    <p class="text-xl text-default font-medium">
      {{ 'DEVICES.DETAILS.NOT_FOUND' | transloco }}
    </p>
  }
</app-content-layout>
