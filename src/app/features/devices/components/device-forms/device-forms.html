<app-content-layout
[title]="title">
<div class="flex flex-col gap-6">
    <form [formGroup]="deviceForm" class="flex flex-col gap-4 bg-container border border-outline rounded-md p-4 w-5xl max-w-full  break-all">
      <div class="flex flex-col gap-1 w-full lg:w-auto md:min-w-75">
        <label for="location" class="text-sm text-neutral font-medium mb-1.5">
            {{'MONITORING.FILTERS.LOCATION' | transloco}}
        </label>
        <app-location-tree-select formControlName="location"></app-location-tree-select>
      </div>

      <app-input
        formControlName="name"
        type="text"
        label='COMMON.FORM.NAME'
        placeholder='COMMON.FORM.NAME_PLACEHOLDER'
      />

      <app-input
        formControlName="mac"
        type="text"
        label='MAC'
        placeholder='MAC'
      />

      <app-chip-select
        label="MONITORING.FILTERS.DEVICE_TYPES"
        [options]="deviceTypeOptions()"
        [selected]="selectedTypes()"
        (selectedChange)="onTypesChange($event)"
      />

      <app-input
        formControlName="description"
        type="textarea"
        label='COMMON.FORM.DESCRIPTION'
        placeholder='COMMON.FORM.DESCRIPTION_PLACEHOLDER'
      />

      @if (editing && deviceId) {
        <app-device-firmware-section [deviceId]="deviceId" />
      }

      <div class="flex flex-wrap justify-start gap-3">
        <button
          type="button"
          (click)="save()"
          [disabled]="deviceForm.invalid || submitting()"
          class="px-4 py-2 rounded-md bg-primary text-primary-foreground font-medium disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
        >
          @if (submitting()) {
            <i class="fa-solid fa-spinner fa-spin mr-2"></i>
          }
          {{ 'COMMON.ACTIONS.SAVE' | transloco }}
        </button>
        <button
          type="button"
          (click)="cancel()"
          class="px-4 py-2 rounded-md border border-outline font-medium cursor-pointer"
        >
          {{ 'COMMON.ACTIONS.CANCEL' | transloco }}
        </button>
      </div>
    </form>
  </div>
</app-content-layout>
