<main class="flex flex-col h-screen w-full max-w-[2560px] mx-auto overflow-auto">
  <header
    class="shrink-0 min-h-14 bg-container z-30 flex flex-row flex-wrap items-center px-4 shadow-md w-full"
    >
    <div class="flex flex-1">
      <a
        routerLink="/login"
        class="text-primary hover:text-primary-details inline-flex items-center gap-1 w-fit cursor-pointer">
          <i class="fa-solid fa-arrow-left"></i>
          {{ 'COMMON.ACTIONS.BACK' | translate }}
      </a>
    </div>
    <app-interface-preferences/>
  </header>

  <section class="w-full max-w-[1920px] min-w-0 p-4 md:p-6 flex-1 flex flex-col overflow-y-auto">
    <app-content-layout title="Dashboard">
      <div class="flex flex-col gap-6">

        <form [formGroup]="filterForm" class="flex flex-col gap-4 bg-container border border-outline rounded-md p-4 break-all">
          <div class="flex flex-wrap gap-4">
            <div class="flex flex-col gap-1 w-full lg:w-auto md:min-w-75">
              <label for="location" class="text-sm text-neutral font-medium mb-1.5">
                {{ 'MONITORING.FILTERS.LOCATION' | translate }}
              </label>
              <app-location-tree-select formControlName="location"></app-location-tree-select>
            </div>

            <div class="flex flex-col gap-1 w-full lg:max-w-140">
              <label for="timeBucket" class="text-sm text-neutral font-medium mb-1.5">
                {{ 'MONITORING.FILTERS.INTERVAL' | translate }}
              </label>
              <app-interval-selector
                [options]="intervalOptions"
                [value]="filterForm.value.timeBucket"
                (valueChange)="filterForm.controls.timeBucket.setValue($event)"
              />
            </div>
          </div>

          <app-chip-select
            label="MONITORING.FILTERS.DEVICE_TYPES"
            [options]="deviceTypeOptions"
            [max]="2"
            [(selected)]="selectedTypes"
          />

          <app-search-button
            [loading]="store.loading()"
            [disabled]="filterForm.invalid || selectedTypes().length === 0"
            (clicked)="search()"
          />
        </form>

        <app-chart-panel
          [data]="store.data()"
          [loading]="store.loading()"
          [error]="store.error()"
          [title]="chartTitle()"
          [subtitle]="chartSubtitle()"
        />
      </div>
    </app-content-layout>
  </section>
</main>
