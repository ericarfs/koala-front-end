<app-content-layout
  [title]="'SENSORS.LIST.TITLE' | transloco"
  [subtitle]="'SENSORS.LIST.SUBTITLE' | transloco"
>
  <button
        actions
        type="button"
        (click)="newSensor()"
        class="btn px-4 bg-primary text-primary-foreground hover:bg-primary-details gap-1"
      >
        <i class="fa-solid fa-plus"></i>
       {{'SENSORS.ADD.TITLE' | transloco}}
  </button>
  @if (store.loading()) {
    <div class="flex flex-wrap justify-center lg:justify-start gap-2 w-full">
      @for(i of [1, 2, 3, 4, 5, 6]; track i){
        <div class="flex flex-col justify-between gap-3 md:gap-2 w-full max-w-full md:w-50 md:min-h-50 p-4 bg-container rounded-sm outline outline-outline">
          <div class="bg-neutral/10 h-5 w-20 rounded"></div>
          <div class="flex-1 break-words">
            <div class="bg-neutral/10 h-6 w-full rounded"></div>
          </div>
          <div class="flex justify-end items-center">
            <div class="bg-neutral/10 h-5 w-10 rounded"></div>
          </div>
        </div>
      }
    </div>
  }
  @else if (deviceTypes().length === 0) {
    <p class="text-neutral text-xl">
      {{'SENSORS.LIST.EMPTY' | transloco}}
    </p>
  } @else {
    <div class="flex flex-wrap justify-center lg:justify-start gap-2 w-full">
      @for(sensor of deviceTypes(); track sensor.id){
        <div class="flex flex-col justify-between gap-3 md:gap-2 w-full max-w-full md:w-50 md:min-h-50 p-4 bg-container rounded-sm outline outline-outline">
          <div class="flex flex-wrap justify-between items-center gap-2 text-sm text-neutral min-h-6">
            <div class="flex items-center justify-center min-h-6 w-6 bg-secondary rounded-sm text-primary-foreground">
              <i class="text-xs fa-solid {{ sensor.icon ? sensor.icon : 'fa-microchip' }}"></i>
            </div>
            <app-action-buttons
              [deleteMessageKey]="'SENSORS.DELETE.CONFIRM'"
              [deleteMessageParams]="{ name: sensor.name }"
              (edit)="updateSensor(sensor)"
              (delete)="deleteSensor(sensor)"
            />
          </div>
          <div class="break-all">
            <p class="font-bold text-default">{{ sensor.name }}</p>
          </div>
          <div class="flex-1 break-words">
            <p class="text-sm leading-tight">{{ sensor.description }}</p>
          </div>

        </div>
      }

    </div>
  }
</app-content-layout>
